name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The APK workflow leans on these two helpers. A syntax error in one of them is otherwise
      # only discovered ten minutes into an APK build, so exercise them here too.
      - name: Smoke-test the mobile helper scripts
        run: |
          node scripts/apply-mobile-config.mjs
          node scripts/patch-android-manifest.mjs
          git diff --exit-code -- mobile/capacitor.config.json
