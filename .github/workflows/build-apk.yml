name: Build APK

# The APK is entirely self-contained: it bundles dist/ and serves it from https://localhost, so
# there is no host, no URL and no secret to point it at. Everything happens on the runner.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu-latest image already ships the Android SDK (ANDROID_HOME=/usr/local/lib/android/sdk)
      # with platform android-36, build-tools 36 and platform-tools preinstalled — exactly what
      # compileSdk 36 needs, so there is nothing to download. android-actions/setup-android@v3 is
      # deliberately NOT used: it aborts with "Failed to find package 'tools'" because it still
      # tries to install the legacy tools package, which Google removed from the SDK repository.
      - name: Locate the preinstalled Android SDK and accept its licences
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDK"

          SDKMANAGER="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            echo "Licences accepted through $SDKMANAGER"
          else
            echo "::warning::sdkmanager not found — relying on the licences already accepted in the image."
          fi

          echo "--- platforms:"; ls -1 "$SDK"/platforms 2>/dev/null || true
          echo "--- build-tools:"; ls -1 "$SDK"/build-tools 2>/dev/null || true

      - name: Build web assets
        run: |
          npm ci
          npm run build

      - name: Normalise the mobile shell (self-contained — there is no server)
        run: node scripts/apply-mobile-config.mjs

      # The Capacitor config lives in mobile/ (which has its own package.json, because the CLI
      # insists on running from a package root), so the generated android/ project lands there too.
      - name: Generate the native android project
        working-directory: mobile
        run: |
          npx --no-install cap add android
          npx --no-install cap sync android

      # The Capacitor template hard-codes versionName "1.0", so the APK would claim 1.0 forever.
      # Stamp it from the tag (vX.Y.Z), or — on workflow_dispatch — from package.json. The version
      # code is monotonic: major*10000 + minor*100 + patch.
      - name: Stamp the version on the native project
        run: |
          set -euo pipefail
          GRADLE=mobile/android/app/build.gradle
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION" in
            *[0-9].*[0-9]*.[0-9]*) ;;
            *) echo "::error::Cannot derive a valid APK version from '$VERSION'"; exit 1 ;;
          esac
          MAJOR="${VERSION%%.*}"; REST="${VERSION#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i -E "s/^(\s*)versionCode\s+[0-9]+\s*$/\1versionCode $VERSION_CODE/; s/^(\s*)versionName\s+\"[^\"]*\"\s*$/\1versionName \"$VERSION\"/" "$GRADLE"
          echo "APK identity: versionName $VERSION · versionCode $VERSION_CODE"
          grep -nE "version(Name|Code)" "$GRADLE"

      - name: Grant the camera permission QR scanning needs
        run: node scripts/patch-android-manifest.mjs

      - name: Build APK (release)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # assembleRelease produces an UNSIGNED apk, and Android will not install an unsigned apk at
      # all. So this step always signs: with the release keystore when the secrets exist, otherwise
      # with a throwaway debug key, so that "Run workflow" alone yields an installable APK with no
      # setup. Swap in the three ANDROID_KEYSTORE_* secrets before distributing it anywhere real.
      - name: Sign the APK
        run: |
          set -euo pipefail
          OUT_DIR=mobile/android/app/build/outputs/apk/release
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "Signing with the release keystore from the repository secrets."
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > release-keystore.jks
            KS=release-keystore.jks
            KS_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_PASS="${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret set — signing with a throwaway debug key."
            echo "::warning::The APK installs fine, but it is not suitable for the Play Store and a"
            echo "::warning::later keystore cannot update over it (Android checks the signature)."
            keytool -genkeypair -keystore debug-keystore.jks -storetype JKS \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
            KS=debug-keystore.jks
            KS_PASS=android
            KEY_PASS=android
          fi

          # Work out which key to use rather than assuming an alias name, and fail loudly if the
          # keystore cannot be opened (a typo in ANDROID_KEYSTORE_PASSWORD is easy to make).
          if ! keytool -list -keystore "$KS" -storepass "$KS_PASS" > /tmp/keystore.txt 2> /tmp/keystore.err; then
            echo "::error::Could not read $KS with the supplied password."
            cat /tmp/keystore.err
            exit 1
          fi
          ALIAS_NAME="$(awk -F, '/PrivateKeyEntry/ {print $1; exit}' /tmp/keystore.txt | tr -d '[:space:]')"
          echo "Signing key alias: ${ALIAS_NAME:-<default>}"
          ALIAS_ARG=""
          [ -n "$ALIAS_NAME" ] && ALIAS_ARG="-ks-key-alias $ALIAS_NAME"

          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in \$ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using $APKSIGNER"

          shopt -s nullglob
          for apk in "$OUT_DIR"/*.apk; do
            if [ "$(basename "$apk")" = "streamdrop.apk" ]; then
              continue
            fi
            "$APKSIGNER" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
              $ALIAS_ARG --out "$OUT_DIR/streamdrop.apk" "$apk"
            rm -f "$apk"
          done

          "$APKSIGNER" verify --print-certs "$OUT_DIR/streamdrop.apk" | head -3
          ls -lh "$OUT_DIR"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: streamdrop-apk
          path: mobile/android/app/build/outputs/apk/release/streamdrop.apk

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/release/streamdrop.apk
          generate_release_notes: true
          body: |
            **Download `streamdrop.apk` below and open it on your phone.**

            - Needs Android 7.0 or newer (minSdk 24).
            - Your phone will warn you about installing an unknown app — allow it for whatever
              app you downloaded with (Chrome, Files), then open the APK again.
            - One code does everything: the key travels inside the connection code, so the
              receiver scans twice and types nothing. Prefer the stricter two-channel flow?
              Options → "keep the key out of the code".
            - The app needs no account, no server and no network identity: two phones exchange a
              connection code, and the file travels straight between them.

            Unless the `ANDROID_KEYSTORE_*` repository secrets are set, this APK is signed with a
            throwaway debug key. It installs fine, but a future properly-signed build cannot
            upgrade over it — you would uninstall this one first.
